[pytest]
testpaths = tests ETL/tests backend/tests
pythonpath = . ETL backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers --tb=short
asyncio_default_fixture_loop_scope = function
markers =
    sqlserver: integración con SQL Server; requiere activación y destino de prueba explícitos
